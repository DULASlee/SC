openapi: 3.0.3
info:
  title: GenCollector BFF API (TASK-015 冻结版本 v1.0)
  version: 1.0.0
  description: |
    GenCollector BFF API。TASK-015 契约冻结最小集。

    冻结字段命名（camelCase）：
    - deviceId / tenantId / siteId / lineId / variableId
    - timestamp (integer UTC milliseconds)
    - quality (integer 0-3: 0=GOOD, 1=UNCERTAIN, 2=BAD, 3=OFFLINE)

    已知开放问题（移到 TASK-016+）：
    - AndonStatus enum 冲突（4 套）
    - CommandStatus enum 冲突（OpenAPI vs MQTT）
    - Ditto feature key (telemetry vs realtime)
    - collectorId 跨契约不一致

    单一真源：
    - L1-α 骨架 payload：./schemas/telemetry.json
    - 业务代码 payload (frozen v1.0)：./schemas/sample-data.json

servers:
  - url: http://localhost:5000/api/v1
    description: 本地开发

paths:
  /telemetry:
    post:
      operationId: ingestTelemetry
      summary: 'L1-α 骨架端点（frozen v1.0）— 单一真源: schemas/telemetry.json'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/telemetry.json'
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                  rejected:
                    type: integer
                required: [accepted, rejected]

  /devices:
    get:
      operationId: listDevices
      summary: 'frozen v1.0 — payload: schemas/sample-data.json (对齐 SampleData DTO)'
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [deviceId, tenantId, siteId, lineId]
                  properties:
                    deviceId:
                      type: string
                    tenantId:
                      type: string
                    siteId:
                      type: string
                    lineId:
                      type: string

  /alarms:
    get:
      operationId: listAlarms
      summary: 'frozen v1.0 占位 — 完整 schema 留给 TASK-016'
      responses:
        '200':
          description: 告警列表（占位）
