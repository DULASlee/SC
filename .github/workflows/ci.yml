name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-consistency:
    name: L1-alpha contract consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run L1-alpha consistency check
        run: python scripts/check-contract-consistency.py
