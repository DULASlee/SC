name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # L1-alpha 阶段建立的契约一致性检查
  contract-consistency:
    name: L1-alpha contract consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run L1-alpha consistency check
        run: python scripts/check-contract-consistency.py

  # L2-A 阶段建立的确定性编译门禁
  # - TreatWarningsAsErrors=true: 所有 CS/RS/RCS 警告升级为错误
  # - EnforceCodeStyleInBuild=true: 强制 .editorconfig 编码风格
  # - 跳过 LnkCollector_src (netcoreapp3.1 EOL); 其它 7 个工程必须 0 错误
  build-warnings-as-errors:
    name: L2-A deterministic compile gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore src/Collector/GenCollector/GenCollector.csproj -r win-x86
          dotnet restore src/Frontend/GenDashboard/GenDashboard.csproj
          dotnet restore tests/GenCollector.Tests/GenCollector.Tests.csproj
          dotnet restore tests/GenDashboard.Tests/GenDashboard.Tests.csproj
          dotnet restore src/Backend/IoTPlatform.Core/IoTPlatform.Core.csproj
          dotnet restore src/Backend/IoTPlatform.Adapters/IoTPlatform.Adapters.csproj
          dotnet restore src/Backend/IoTPlatform.Host/IoTPlatform.Host.csproj
          dotnet restore src/Frontend/IoTPlatform.UI.Wpf/IoTPlatform.UI.Wpf.csproj
          # LnkCollector_src skipped: netcoreapp3.1 EOL + reverse-engineered reference

      - name: Build (Treat Warnings As Errors)
        run: |
          dotnet build src/Collector/GenCollector/GenCollector.csproj -c Release -r win-x86 --self-contained true -p:PlatformTarget=x86 --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build src/Frontend/GenDashboard/GenDashboard.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build tests/GenCollector.Tests/GenCollector.Tests.csproj -c Release -p:PlatformTarget=x86 --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build tests/GenDashboard.Tests/GenDashboard.Tests.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build src/Backend/IoTPlatform.Core/IoTPlatform.Core.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build src/Backend/IoTPlatform.Adapters/IoTPlatform.Adapters.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build src/Backend/IoTPlatform.Host/IoTPlatform.Host.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
          dotnet build src/Frontend/IoTPlatform.UI.Wpf/IoTPlatform.UI.Wpf.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Test
        run: |
          dotnet test tests/GenCollector.Tests/GenCollector.Tests.csproj -c Release --no-build -p:PlatformTarget=x86
          dotnet test tests/GenDashboard.Tests/GenDashboard.Tests.csproj -c Release --no-build

      - name: Generate Coverage Report (L2-B)
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v6
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'Html;Cobertura;JsonSummary'

      - name: Check Coverage Threshold (Line >= 80%)
        if: always()
        shell: bash
        run: |
          COVERAGE=$(cat coveragereport/Summary.json | jq -r '.summary.linecoverage')
          echo "Line coverage: ${COVERAGE}%"
          # Note: bash arithmetic via awk (more portable than bc on ubuntu-latest)
          if [ "$(awk -v c="$COVERAGE" 'BEGIN { print (c < 80) ? 1 : 0 }')" -eq 1 ]; then
            echo "FAIL: Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

  # L2-B 阶段建立的变异测试门禁
  # - 阻止假测试（Assert.True(true) 等）— 详见 harness/l2-b-report.md §三 F1
  # - 当前 GenCollector mutation score ~58% 阈值 < 60% threshold-low 但 >= 50% threshold-break → CI 不会因分数低而失败
  # - 后续 L2-B+ 任务需提升覆盖率（critical path 加单测）
  mutation-test:
    name: L2-B Mutation Test (Stryker)
    runs-on: ubuntu-latest
    needs: build-warnings-as-errors
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore src/Collector/GenCollector/GenCollector.csproj
          dotnet restore tests/GenCollector.Tests/GenCollector.Tests.csproj

      - name: Install Stryker
        run: dotnet tool restore

      - name: Run Stryker Mutation Tests
        # L2-B Phase 1 早期：观察期，不阻断 merge（continue-on-error: true）。
        # 阶段推进见 docs/adr/ADR-005-Mutation-Score-Progression.md。
        # 当业务层 ≥ 3 模块有 60% 单测时，移除 continue-on-error: true 并提升阈值。
        run: dotnet stryker --config-file stryker-config.json --break-at 15 --concurrency 2
        continue-on-error: true

      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: warn

  # ============================================
  # L3 任务卡校验（harness 任务协议）
  # ============================================
  validate-task-cards:
    name: L3 Validate Task Cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Validate all active task cards
        run: python .harness/scripts/validate-task-card.py --all

  # ============================================
  # L3 PR scope 检查（仅在 pull_request 触发）
  # ============================================
  check-pr-scope:
    name: L3 Check PR Scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Check PR scope
        env:
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
        run: python .harness/scripts/check-pr-scope.py --base origin/${{ github.base_ref }}

  # ============================================
  # L4-A 工具链烟雾测试（可靠性测试骨架）
  # ============================================
  # 注：当前烟雾测试只验证 Testcontainers 4.x + Mosquitto + Toxiproxy +
  #     FluentAssertions 工具链的"类型可加载 + 编译通过"（不实际启动 Docker 容器）。
  #     真实启动容器留给 L4-B+ 任务卡（需要 CI runner 有 Docker daemon）。
  reliability-toolchain:
    name: L4-A Reliability Toolchain Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/ReliabilityTests/ReliabilityTests.csproj

      - name: Build (Treat Warnings As Errors)
        run: dotnet build tests/ReliabilityTests/ReliabilityTests.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      - name: Run Toolchain Smoke Tests
        run: dotnet test tests/ReliabilityTests/ReliabilityTests.csproj -c Release --no-build --logger "trx;LogFileName=reliability-toolchain.trx"

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-toolchain-test-report
          path: tests/ReliabilityTests/TestResults/**/reliability-toolchain.trx
          if-no-files-found: warn
