    - .harness/tasks/active/TASK-010.yaml
    - .harness/tasks/active/TASK-011.yaml
    - .harness/tasks/active/TASK-012.yaml
    - .harness/tasks/active/TASK-013.yaml
    - .harness/tasks/active/TASK-014.yaml
    - .harness/tasks/active/TASK-017.yaml
