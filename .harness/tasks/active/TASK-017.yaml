notes: |
  ## 背景（CI 证据）
  最近 4 个 PR 的 CI 均挂在 L3 Check PR Scope，其余 6 个 job 全绿：
  1. PR #6（TASK-014）：lessons-learned.md 不在 allow_write，而该修改是铁律 12 强制要求
  2. PR #4（TASK-012）：deny tests/**/*.cs 覆盖 allow tests/ReliabilityTests/**/*.cs（deny 先行，allow 成死信）
  3. PR #2（TASK-009/010）：脚本只取第一张卡，TASK-010.yaml 自身变更被判越界
  4. PR #3（TASK-011）：同模式
  另：ci.yml pull_request/push paths 不含 .harness/**、docs/ai-workspace/**、.githooks/**，
  纯文档/治理 PR 完全不触发 CI，scope 门禁被绕过。

  ## 改动
  - check-pr-scope.py v2：多卡 allow/deny 并集；allow 先行，命中 deny 且同时命中 allow 时
    报 [CONFIG-CONFLICT]（deny 仍优先）；规模限制按卡求和；--task-id 支持逗号分隔
  - main 上已合入的 active 卡 009-014：allow_write 统一追加 docs/ai-workspace/rules/lessons-learned.md
    （在制契约冻结卡尚未合入 main，不在本 PR 范围；其工作区草稿已同样补行，随其自身 PR 提交）
  - TASK-012：移除与 allow 重叠的 deny tests/**/*.cs
  - ci.yml：paths 追加 .harness/**、docs/ai-workspace/**、docs/architecture/**、.githooks/**、AGENTS.md、.github/workflows/**
  - TASK-TEMPLATE.yaml：allow_write 追加 lessons-learned.md（防复发）
  - 本卡供修复 PR 自举通过 scope 门禁

  ## 编号说明（架构师决策 2026-09-18）
  原方案拟用编号与 TASK-015 notes 预留的"契约漂移跟进（AsyncAPI/alarm-state-machine）"冲突。
  架构师拍板：本修复卡改号 TASK-017；预留编号继续保留给契约漂移跟进，待本卡合并后另行处理其引用。
  本卡方案经架构师书面审核批准执行（授权标记 [APPROVED-BY: DULASlee]）。

