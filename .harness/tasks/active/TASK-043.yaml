notes: |
  ## 背景
  v1.1 计划 P2+P3（§10/§11）+ 修订 A1/A5 + 补充 B1/B5：
  协调根=仓库级 .harness/runs/ 语义（排除用户级）；锁复用 modelswap/loop
  已 Windows 实战的 mkdir+pid+600s-stale 模式，泛化为 coord.py 统一实现；
  Reserve/Release/UpdateState/ClaimTask/CompleteTask 进同一临界区，
  覆盖双账本（RUNS+PIPELINE）全部读写含 append 路径（Windows 并发
  append 无逐行原子保证）。slot 释放联动陈旧 worktree 回收（B1）。
  崩溃恢复复用 pid_alive/stale 检测，不重做任务系统。

  ## 与 TASK-042 的接缝
  登记簿归属协调根；本卡不得改动 start-session 入口语义。
  modelswap.py 的锁实现本卡不动（P4 退役时处理）。

  ## 验收说明
  acceptance_tests 为形式占位（TASK-023 先例）。实质验收 = allow 内
  test_coord/test_runs/test_dispatch/test_poll/test_loop 五文件
  （unittest discover -t .harness），先红后绿，红态留 docs/testing/red/TASK-043/。
