notes: |
  ## 冻结决策（基于现有代码 + 11 处漂移）

  ### 已决议（6 项）
  1. **tenant_id** → camelCase `tenantId` (matches MQTT payload + L1-α schema)
  2. **device_id** → plain string `deviceId` (matches GenCollector payload "CNC04")
  3. **variable_id** → camelCase `variableId`, 模式 `[a-zA-Z][a-zA-Z0-9_]*`
  4. **timestamp** → integer UTC milliseconds (drop timestampIso from MQTT)
  5. **quality** → integer 0-3 (GOOD/UNCERTAIN/BAD/OFFLINE) - drop string enum
  6. **telemetry payload** → contracts/schemas/telemetry.json 为唯一真源

  ### 开放问题（移到 TASK-016+）
  - AndonStatus enum 冲突（4 套）
  - CommandStatus enum 冲突（OpenAPI vs MQTT）
  - Ditto feature key (telemetry vs realtime)
  - siteId 在 OpenAPI/AsyncAPI 缺失
  - collectorId 跨契约不一致

  ### 不做
  - 不写业务代码
  - 不改 C# 代码
  - AsyncAPI/alarm-state-machine 留给 TASK-016
