  | RCS1007 Add braces | 100+ | src/Backend/IoTPlatform.Core/*, ReliabilityTests | 是 | 否（机械加花括号） | TASK-012 消 ReliabilityTests + Core |
  | RCS1264 (was 1008) Use explicit type | 60+ | 同上 | 是 | 否（var→显式） | TASK-012 消试点 |
