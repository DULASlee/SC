notes: |
  1. Directory.Build.props 加 Roslynator.Analyzers 4.12.9 包引用（PackageReference，PrivateAssets=all）
  2. .editorconfig 新建 [Roslynator] 段，白名单仅含低风险类别：
     - 格式：RCS0001-RCS0030 范围内选 5-8 条（换行/空格/文件尾）
     - 简化：RCS1000-RCS1099 范围内选 3-5 条（expression-body、var、remove-unnecessary-braces）
     - unused：RCS1213 等 2-3 条
     - 总计不超过 15 条规则，全部 severity=warning
  3. 在 tests/ReliabilityTests 跑 dotnet build，确认白名单规则生效
  4. 全仓 dotnet build 跑一次，收集所有 RCS 警告（当前应为 0 因为没全开），记录到任务卡 notes
  5. 交付物：警告分类报告（按规则ID/项目/是否纯style/是否需改业务 四列），作为 TASK-014 输入
  6. 不消全仓警告，不改 src/ 任何文件

