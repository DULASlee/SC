    补 validate 的逐字段声明校验 + 故意违规测试证明回路有效。
  additionalProperties 三问确认结果（架构师要求开工前 3 分钟确认）：
  Q1 HEAD schema 无 approver 定义（实锤）；Q2 工作树 +4 行 diff = 字段定义本身
