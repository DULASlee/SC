  （单一合法值，枚举约束 = 已声明角色名清单，防拼写幽灵条目）。
  schema 顶层/scope/constraints 均 additionalProperties:false → 属架构师决策树第 3 行
  「validate 仍放行 = 门禁本身 bug」：本卡顺序 = 先修 validate 检测逻辑，再合入
  schema 字段定义（顺序反了则修复无法被验证）。
  判据（架构师钉死 1-5，本卡执行）：
  1. schema 增补 approver（type string + 枚举值约束：仅 architect，防拼写幽灵）；
  2. 全仓 yaml 跑一遍校验产出「缺字段/未声明」清单（回填集 = recon-list §11 的 18 张，
