  3. CI validate job 转绿 + git show HEAD schema grep approver >= 1；
  4. schema 自检回路判定（防 schema-of-schema 失实）；
  5. 故意违规测试：临时卡加 schema 未声明字段 → validate 必 FAIL（临时文件，不进任何卡，
     结果入 closeout notes——与 030 同源逻辑：改了判定路径必须证明判定会触发）。
  回填集 18 张处置边界（架构师裁定）：本卡只产出 schema 定义 + 检测面 + 回填清单；
  18 张卡的 approver 字段已在 023 迁移写入（存量），11 张 in-progress 历史卡的
  关闭走 R1 语义（verify-all + 逐卡裁定），其 approver 缺失标记为「历史缺失」，
  不补填推断值。
  铁律 15：本卡不触 executor_argv/执行机器，无需 probe。
  closeout（架构师 2026-09-19 P0 放行；R1-C 语义：实施落地即归档，裁定非自报；
  状态保持 ready 待 L3 收口 verify-all + archive-task）：
