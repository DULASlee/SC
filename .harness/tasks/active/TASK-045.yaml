notes: |
  ## 背景
  v1.1 计划 P5（§13）+ 修订 A3：ownership 落协调根 <runs>/ownership/，
  记录 TaskId/OwnerSessionId/OwnerWorktree/State。claim 临界区=
  持锁→读卡→验无主→写 in-progress→commit→记 ownership→释锁；
  非 owner 写任务状态=拒绝（不是 warning）。

  ## 三条硬语义（A3，施工不得偏离）
  1. ownership 键 = TaskId，不是 attempt；
  2. 同任务 attempt 重试链合法复用同一 worktree（复位后重派）；
  3. OwnerSessionId 变更仅在任务释放（blocked/awaiting-review/done）后。
  违反 2/3 会打断现有重试机制并误伤 Gate F 回归。

  ## 判定权不变
  dispatcher/本卡实现永不写 done；done 唯一来源仍是人类 verify-all.py
  + archive-task.py（dispatcher 三规则照旧）。

  ## 验收说明
  acceptance_tests 为形式占位（TASK-023 先例）。实质验收 = allow 内
  test_ownership（含 claim 冲突拒绝、非 owner 写拒绝、重试链复用同
  worktree 三用例）+ test_coord/test_dispatch 回归，红态留
  docs/testing/red/TASK-045/。
